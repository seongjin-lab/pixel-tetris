name: PixelTetris
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  PixelTetris:
    type: application
    platform: iOS
    sources:
      - GameApp.swift
      - BoardSwipe.swift
      - Assets.xcassets
      - path: ../sounds
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seongjinlab.pixeltetris
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 픽셀 테트리스
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "4"
        MARKETING_VERSION: "0.1.3"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Bridge.h"
        OTHER_LDFLAGS:
          - "$(DERIVED_FILE_DIR)/libPixelEngine.a"
    preBuildScripts:
      - name: Go 게임 엔진 빌드
        script: '"$SRCROOT/build-engine.sh"'
        basedOnDependencyAnalysis: false
